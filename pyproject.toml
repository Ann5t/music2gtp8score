[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music2gtp8score"
version = "0.1.0"
description = "Turn an audio recording into a Guitar Pro 7/8 (.gp) score engraved to your own layout rules."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6",
]

[project.optional-dependencies]
audio = [
    "librosa>=0.10",
    "soundfile>=0.12",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
music2gtp8score = "music2gtp8score.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["vendor", "tools", "out"]
